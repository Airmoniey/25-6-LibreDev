<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreLivro - Sua Biblioteca Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            max-width: 600px;
            animation: fadeIn 1.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 4.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #ffdd59;
            text-shadow: 3px 3px 0 #000, 5px 5px 10px rgba(0,0,0,0.5);
        }
        
        .tagline {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #f5f5f5;
        }
        
        .description {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            color: #e0e0e0;
        }
        
        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: #ff3860;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .cta-button:hover {
            background: #ff2b56;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        
        .cta-button:active {
            transform: translateY(0);
        }
        
        /* Animação dos livros no fundo */
        .book {
            position: absolute;
            width: 60px;
            height: 90px;
            background: linear-gradient(45deg, #8b4513, #a0522d, #cd853f);
            border-radius: 5px 10px 10px 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 1;
            animation: float linear infinite;
        }
        
        .book::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 5px;
            width: 50px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .book::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 55px;
            height: 80px;
            border-left: 5px solid rgba(0, 0, 0, 0.2);
        }
        
        .book:nth-child(2n) {
            background: linear-gradient(45deg, #2c3e50, #34495e, #2c3e50);
        }
        
        .book:nth-child(3n) {
            background: linear-gradient(45deg, #c0392b, #e74c3c, #c0392b);
        }
        
        .book:nth-child(4n) {
            background: linear-gradient(45deg, #16a085, #1abc9c, #16a085);
        }
        
        .book:nth-child(5n) {
            background: linear-gradient(45deg, #2980b9, #3498db, #2980b9);
        }
        
        @keyframes float {
            from { transform: translateY(100vh) rotate(0deg); }
            to { transform: translateY(-200px) rotate(360deg); }
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                width: 90%;
                padding: 1.5rem;
            }
            
            .logo {
                font-size: 3.5rem;
            }
            
            .tagline {
                font-size: 1.2rem;
            }
            
            .description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Livros animados em fundo -->
    <div class="book" style="left: 5%; animation-duration: 30s; animation-delay: 0s;"></div>
    <div class="book" style="left: 10%; animation-duration: 35s; animation-delay: 5s;"></div>
    <div class="book" style="left: 20%; animation-duration: 40s; animation-delay: 10s;"></div>
    <div class="book" style="left: 30%; animation-duration: 45s; animation-delay: 15s;"></div>
    <div class="book" style="left: 40%; animation-duration: 50s; animation-delay: 20s;"></div>
    <div class="book" style="left: 50%; animation-duration: 55s; animation-delay: 25s;"></div>
    <div class="book" style="left: 60%; animation-duration: 60s; animation-delay: 30s;"></div>
    <div class="book" style="left: 70%; animation-duration: 65s; animation-delay: 35s;"></div>
    <div class="book" style="left: 80%; animation-duration: 70s; animation-delay: 40s;"></div>
    <div class="book" style="left: 90%; animation-duration: 75s; animation-delay: 45s;"></div>
    
    <!-- Conteúdo principal -->
    <div class="container">
        <h1 class="logo">LibreLivro</h1>
        <p class="tagline">Descubra um universo de conhecimento</p>
        <p class="description">Milhares de livros à sua disposição. Leia, descubra e explore mundos infinitos sem sair de casa. Sua próxima grande aventura literária está a apenas um clique de distância.</p>
        <a href="home.html" class="cta-button">Conhecer</a>
    </div>

    <script>
        // Adiciona mais livros dinamicamente para um fundo mais rico
        document.addEventListener('DOMContentLoaded', function() {
            const body = document.querySelector('body');
            for (let i = 0; i < 15; i++) {
                const book = document.createElement('div');
                book.classList.add('book');
                book.style.left = Math.random() * 100 + '%';
                book.style.animationDuration = (25 + Math.random() * 40) + 's';
                book.style.animationDelay = (Math.random() * 50) + 's';
                book.style.transform = 'scale(' + (0.5 + Math.random() * 0.7) + ')';
                body.appendChild(book);
            }
        });
    </script>
</body>
</html>
